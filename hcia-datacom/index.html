    + `<a class="port ref" href="#ref" title="Quick reference"><span class="led"></span><span class="jack"></span>REF</a>`;
  const cards = CH.map(c => {
    const s = status(c.ch), best = P.quiz[c.ch];
    const pill = s === "pass" ? `<span class="pill pass">Quiz ${best}/5</span>` : s === "read" ? `<span class="pill read">${best != null ? "Quiz " + best + "/5" : "Studying"}</span>` : `<span class="pill">Not started</span>`;
    return `<a class="chcard" href="#ch${c.ch}"><div class="no"><span>Chapter ${c.ch}</span>${pill}</div><h3>${esc(c.title)}</h3><p>${esc(c.focus)}</p></a>`;
  }).join("");
  view.innerHTML = `
  <section class="hero">
    <div>
      <div class="eyebrow">&lt;HCIA&gt; <b>display</b> study-guide</div>
      <h1>HCIA-Datacom V2.0<br>Study Guide</h1>
      <p class="lead">All 23 chapters in simple English, with ${CH.length * 3} diagrams, notes for every topic and ${ALLQ.length} practice questions that mark themselves.</p>
      <div class="row">
        ${last ? `<a class="btn primary" href="#ch${last.ch}">Continue: Chapter ${last.ch}</a><a class="btn" href="#ch1">Start from Chapter 1</a>` : `<a class="btn primary" href="#ch1">Start with Chapter 1</a>`}
        <a class="btn" href="#exam">Practice exam</a>
        ${pdfBtn()}
      </div>
    </div>
    <div class="panel" aria-label="Your progress">
      <h2>Your progress <span>one port per chapter</span></h2>
      <div class="ports">${ports}</div>
      <div class="legend"><span><i style="background:#3B474E"></i>Not started</span><span><i style="background:#F2B233"></i>Studying</span><span><i style="background:#3DDC6A"></i>Quiz passed (4 or 5 out of 5)</span></div>
      <div class="sum">${done} of 23 chapters passed</div>
    </div>
  </section>
  <div class="sec-h"><h2>How to study a chapter</h2></div>
  <ol class="steps">
    <li><b>Look at the pictures</b>Read the "How to read it" note under each one first.</li>
    <li><b>Read the notes</b>Plain explanation, then the facts, commands and exam traps.</li>
    <li><b>Test yourself</b>Turn on "Test myself" to hide the boxes, then try to remember them.</li>
    <li><b>Do the quiz</b>Get 4 out of 5 to light the chapter's port green.</li>
  </ol>
  <div class="sec-h"><h2>Chapters</h2><span class="note">Tap a chapter to open it</span></div>
  <div class="chgrid">${cards}</div>
  ${footer}`;
}

/* ---------- chapter ---------- */
function quizHtml(qs, prefix){
  return qs.map((q, i) => `
    <div class="qitem" data-q="${i}">
      <div class="qtag">Question ${i + 1} · ${tagFor(q)}</div>
      <div class="qtext">${esc(q.q)}</div>
      <div class="opts">${q.opts.map((o, k) => `<button type="button" class="opt ${q.type === "multi" ? "multi" : ""}" data-k="${k}" aria-pressed="false"><span class="k">${q.type === "tf" ? (k ? "F" : "T") : L[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
      <div class="whyslot"></div>
    </div>`).join("");
}
function wireOptions(root, qs){
  $$(".qitem", root).forEach(item => {
    const q = qs[+item.dataset.q];
    $$(".opt", item).forEach(b => b.addEventListener("click", () => {
      if (b.disabled) return;
      if (q.type === "multi") b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true");
      else { $$(".opt", item).forEach(x => x.setAttribute("aria-pressed", "false")); b.setAttribute("aria-pressed", "true"); }
    }));
  });
}
function picked(item){ return $$(".opt", item).filter(b => b.getAttribute("aria-pressed") === "true").map(b => +b.dataset.k); }
function markItem(item, q){
  const sel = picked(item), ok = sameSet(sel, q.ans);
  $$(".opt", item).forEach(b => {
    const k = +b.dataset.k; b.disabled = true;
    if (q.ans.includes(k)) b.classList.add("right"); else if (sel.includes(k)) b.classList.add("wrong");
  });
  const ans = q.ans.map(k => q.type === "tf" ? q.opts[k] : L[k]).join(", ");
  $(".whyslot", item).innerHTML = `<div class="why ${ok ? "ok" : "no"}"><b>${ok ? "Correct." : sel.length ? "Not quite. Answer: " + ans + "." : "No answer given. Answer: " + ans + "."}</b>${esc(q.why)}</div>`;
  return ok;
}

function renderChapter(n){
  const c = CH.find(x => x.ch === n); if (!c) return renderHome();
  P.last = n; save();
  const prev = CH.find(x => x.ch === n - 1), next = CH.find(x => x.ch === n + 1);
  const figs = c.diagrams.map(d => `
    <figure class="fig" id="p${n}-${d.n}">
      <button class="pic" type="button" data-src="${d.src}" data-w="${d.w}" data-title="Picture ${n}.${d.n}: ${esc(d.title)}" aria-label="Enlarge picture ${n}.${d.n}">
        <img src="${d.src}" alt="${esc(d.title)}" loading="lazy" width="${d.w}" height="${d.h}" style="width:min(100%, ${Math.round(d.w * 1.333)}px, calc(78vh * ${(d.w / d.h).toFixed(3)}))">
      </button>
      <figcaption><b>Picture ${n}.${d.n} · How to read it</b>${esc(d.caption)}</figcaption>
    </figure>`).join("");
  const topics = c.topics.map((t, k) => `
    <article class="topic" id="t${n}-${k + 1}">
      <h3><span class="tn">${n}.${k + 1}</span>${esc(t.t)}</h3>
      ${t.s ? `<p class="simple">${t.s}</p>` : ""}
      ${t.f ? `<div class="box rem hid" data-lbl="key facts"><span class="lbl">Remember</span>${t.f}</div>` : ""}
      ${t.c ? `<div class="box cmd hid" data-lbl="command / example"><span class="lbl">Command / example <button class="copy" type="button">Copy</button></span><pre>${esc(t.c)}</pre></div>` : ""}
      ${t.x ? `<div class="box trap hid" data-lbl="exam trap"><span class="lbl">Exam trap</span>${t.x}</div>` : ""}
    </article>`).join("");
  const rail = `
    <div class="grp"><h4>Pictures</h4>${c.diagrams.map(d => `<button type="button" data-jump="p${n}-${d.n}"><span>${n}.${d.n}</span>${esc(d.title)}</button>`).join("")}</div>
    <div class="grp"><h4>Notes</h4>${c.topics.map((t, k) => `<button type="button" data-jump="t${n}-${k + 1}"><span>${n}.${k + 1}</span>${esc(t.t)}</button>`).join("")}</div>
    <div class="grp"><h4>Practice</h4><button type="button" data-jump="quiz${n}"><span>Q</span>Check yourself (5 questions)</button></div>`;
  const best = P.quiz[n];
  view.innerHTML = `
  <div class="crumbs"><a href="#home">All chapters</a></div>
  <header class="chhead">
    <div class="eyebrow">&lt;HCIA&gt; <b>display</b> chapter ${n} <span style="color:var(--muted)">(${n} of 23)</span></div>
    <h1>${esc(c.title)}</h1>
    <div class="focus"><b>Exam focus</b>${esc(c.focus)}</div>
    <div class="row chtools">
      <button class="btn" type="button" id="cover" aria-pressed="false">Test myself: hide the boxes</button>
      <button class="btn" type="button" data-jump="quiz${n}">Go to the quiz</button>
      <button class="btn" type="button" id="markread" aria-pressed="${P.read[n] ? "true" : "false"}">${P.read[n] ? "Studied" : "Mark as studied"}</button>
    </div>
  </header>
  <div class="chlayout">
    <aside class="rail" aria-label="In this chapter">${rail}</aside>
    <div class="content">
      <section class="block"><h2 class="block-h">Pictures</h2><p class="block-sub">Look at these first. Tap a picture to see it bigger.</p>${figs}</section>
      <section class="block" id="notes"><h2 class="block-h">Notes</h2><p class="block-sub">Read each topic, then turn on "Test myself" and try to remember what is in the boxes.</p>${topics}</section>
      <section class="block" id="quiz${n}"><h2 class="block-h">Check yourself</h2><p class="block-sub">${best != null ? "Your best score: " + best + "/5. " : ""}Answer all 5, then press "Check my answers".</p>
        <div class="quiz">${quizHtml(c.quiz)}
          <div class="qbar"><div class="score" id="qscore"></div><div class="row"><button class="btn primary" type="button" id="qcheck">Check my answers</button><button class="btn" type="button" id="qretry" hidden>Try again</button></div></div>
        </div>
      </section>
      <nav class="chnav">${prev ? `<a class="btn" href="#ch${prev.ch}">Chapter ${prev.ch}: ${esc(prev.title)}</a>` : "<span></span>"}${next ? `<a class="btn primary" href="#ch${next.ch}">Next: Chapter ${next.ch}</a>` : `<a class="btn primary" href="#exam">Take a practice exam</a>`}</nav>
    </div>
  </div>
  ${footer}`;

  const quiz = $(".quiz", view);
  wireOptions(quiz, c.quiz);
  $("#qcheck").addEventListener("click", () => {
    let score = 0;
    $$(".qitem", quiz).forEach(item => { if (markItem(item, c.quiz[+item.dataset.q])) score++; });
    $("#qscore").textContent = `You scored ${score} out of 5`;
    $("#qcheck").hidden = true; $("#qretry").hidden = false;
    P.quiz[n] = Math.max(P.quiz[n] == null ? 0 : P.quiz[n], score); save();
    if (score >= 4) toast(`Chapter ${n} passed. Its port is now green.`);
  });
  $("#qretry").addEventListener("click", () => renderChapter(n) || $("#quiz" + n).scrollIntoView());
  const content = $(".content", view);
  $("#cover").addEventListener("click", e => {
    const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
    e.currentTarget.setAttribute("aria-pressed", on); e.currentTarget.textContent = on ? "Test myself: on (tap a box to reveal)" : "Test myself: hide the boxes";
    content.classList.toggle("covering", on);
    $$(".box", content).forEach(b => b.classList.add("hid"));
  });
  content.addEventListener("click", e => {
    const box = e.target.closest(".box.hid");
    if (box && content.classList.contains("covering")) { box.classList.remove("hid"); e.stopPropagation(); return; }
    const cp = e.target.closest(".copy");
    if (cp) {
      const text = cp.closest(".cmd").querySelector("pre").textContent;
      try {
        navigator.clipboard.writeText(text).then(() => toast("Copied"), () => selectText(cp));
      } catch (err) { selectText(cp); }
    }
  });
  $("#markread").addEventListener("click", e => {
    P.read[n] = !P.read[n]; save();
    e.currentTarget.setAttribute("aria-pressed", P.read[n] ? "true" : "false"); e.currentTarget.textContent = P.read[n] ? "Studied" : "Mark as studied";
  });
  $$(".pic", view).forEach(b => b.addEventListener("click", () => openZoom(b.dataset.src, +b.dataset.w, b.dataset.title)));
}
function selectText(btn){
  const pre = btn.closest(".cmd").querySelector("pre"); const r = document.createRange(); r.selectNodeContents(pre);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Selected. Copy it with your keyboard or the menu.");
}
function openZoom(src, w, title){
  layer.innerHTML = `<div class="zoom" role="dialog" aria-label="${title}"><div class="zbar"><span>${title}</span><button type="button" id="zclose">Close</button></div>
    <div class="zbody"><img src="${src}" alt="" style="width:${Math.round(w * 1.6)}px"></div></div>`;
  const close = () => { layer.innerHTML = ""; document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") close(); };
  $("#zclose").addEventListener("click", close); document.addEventListener("keydown", onKey); $("#zclose").focus();
}

/* ---------- practice exam ---------- */
let EX = null, timerId = null;
function renderExam(){
  clearInterval(timerId);
  if (EX && EX.done) return renderExamResult();
  if (EX && !EX.done) return renderExamQuestion();
  const hist = P.exams.slice(-5).reverse();
  view.innerHTML = `
  <div class="sec-h"><h2>Practice exam</h2></div>
  <p class="note" style="max-width:62ch;margin-top:-6px">Random questions from the chapters you choose, one at a time, like the real exam. You see your score and a review of every mistake at the end.</p>
  <div class="card setup">
    <div><div class="label">How many questions</div><div class="choice" id="len">
      ${[20, 40, 60, ALLQ.length].map((x, i) => `<button type="button" class="chip" data-v="${x}" aria-pressed="${i === 1}">${x === ALLQ.length ? "All " + x : x}</button>`).join("")}</div></div>
    <div><div class="label">Chapters</div><div class="choice" id="chs">
      <button type="button" class="chip" data-all="1" aria-pressed="true">All chapters</button>
      ${CH.map(c => `<button type="button" class="chip" data-v="${c.ch}" aria-pressed="false" title="${esc(c.title)}">${c.ch}</button>`).join("")}</div></div>
    <div class="row"><button class="btn primary" type="button" id="start">Start the exam</button><span class="note" id="pool"></span></div>
  </div>
  ${hist.length ? `<div class="sec-h" style="margin-top:28px"><h2 style="font-size:24px">Your recent exams</h2></div><div class="history">${hist.map(h => `<div>${new Date(h.at).toLocaleDateString()}: ${h.score}/${h.total} (${Math.round(100 * h.score / h.total)}%)</div>`).join("")}</div>` : ""}
  ${footer}`;
  const lenBtns = $$("#len .chip"), chBtns = $$("#chs .chip[data-v]"), allBtn = $("#chs .chip[data-all]");
  function chosen(){ const s = chBtns.filter(b => b.getAttribute("aria-pressed") === "true").map(b => +b.dataset.v); return s.length ? s : CH.map(c => c.ch); }
  function pool(){ const s = chosen(); return ALLQ.filter(q => s.includes(q.ch)); }
  function upd(){ const n = pool().length, want = +lenBtns.find(b => b.getAttribute("aria-pressed") === "true").dataset.v;
    $("#pool").textContent = `${Math.min(n, want)} questions from ${n} available`; }
  lenBtns.forEach(b => b.addEventListener("click", () => { lenBtns.forEach(x => x.setAttribute("aria-pressed", "false")); b.setAttribute("aria-pressed", "true"); upd(); }));
  allBtn.addEventListener("click", () => { chBtns.forEach(x => x.setAttribute("aria-pressed", "false")); allBtn.setAttribute("aria-pressed", "true"); upd(); });
  chBtns.forEach(b => b.addEventListener("click", () => {
    b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true");
    allBtn.setAttribute("aria-pressed", chBtns.some(x => x.getAttribute("aria-pressed") === "true") ? "false" : "true"); upd();
  }));
  upd();
  $("#start").addEventListener("click", () => {
    const want = +lenBtns.find(b => b.getAttribute("aria-pressed") === "true").dataset.v;
    const qs = shuffle(pool()).slice(0, want);
    EX = {qs, ans: qs.map(() => []), flag: qs.map(() => false), cur: 0, start: Date.now(), done: false};
    renderExamQuestion();
  });
}
function fmtTime(ms){ const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }
function renderExamQuestion(){
  clearInterval(timerId);
  const q = EX.qs[EX.cur], N = EX.qs.length, answered = EX.ans.filter(a => a.length).length;
  view.innerHTML = `
  <div class="exambar"><strong>Question ${EX.cur + 1} of ${N}</strong><div class="progress" aria-hidden="true"><i style="width:${100 * answered / N}%"></i></div><span class="timer" id="tm">${fmtTime(Date.now() - EX.start)}</span></div>
  <div class="card">
    <div class="qitem" data-q="0" style="padding-top:0">
      <div class="qtag">Chapter ${q.ch} · ${tagFor(q)}</div>
      <div class="qtext">${esc(q.q)}</div>
      <div class="opts">${q.opts.map((o, k) => `<button type="button" class="opt ${q.type === "multi" ? "multi" : ""}" data-k="${k}" aria-pressed="${EX.ans[EX.cur].includes(k)}"><span class="k">${q.type === "tf" ? (k ? "F" : "T") : L[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
    </div>
    <div class="qbar">
      <button class="btn small" type="button" id="flag" aria-pressed="${EX.flag[EX.cur]}">${EX.flag[EX.cur] ? "Flagged" : "Flag for review"}</button>
      <div class="row"><button class="btn" type="button" id="prev" ${EX.cur ? "" : "disabled"}>Back</button>
      ${EX.cur < N - 1 ? `<button class="btn primary" type="button" id="next">Next</button>` : ""}<button class="btn ${EX.cur === N - 1 ? "primary" : ""}" type="button" id="finish">Finish and mark</button></div>
    </div>
    <div class="dots" aria-label="Jump to a question">${EX.qs.map((_, i) => `<button type="button" data-i="${i}" class="${EX.ans[i].length ? "done" : ""} ${i === EX.cur ? "cur" : ""} ${EX.flag[i] ? "flag" : ""}">${i + 1}</button>`).join("")}</div>
  </div>
  <p class="note" id="finmsg"></p>`;
  const item = $(".qitem", view);
  wireOptions(item.parentElement, [q]);
  $$(".opt", item).forEach(b => b.addEventListener("click", () => { EX.ans[EX.cur] = picked(item); }));
  $("#prev").addEventListener("click", () => { EX.cur--; renderExamQuestion(); });
  const nx = $("#next"); if (nx) nx.addEventListener("click", () => { EX.cur++; renderExamQuestion(); });
  $("#flag").addEventListener("click", () => { EX.flag[EX.cur] = !EX.flag[EX.cur]; renderExamQuestion(); });
  $$(".dots button", view).forEach(b => b.addEventListener("click", () => { EX.cur = +b.dataset.i; renderExamQuestion(); }));
  let armed = false;
  $("#finish").addEventListener("click", () => {
    const left = EX.ans.filter(a => !a.length).length;
    if (left && !armed) { armed = true; $("#finmsg").textContent = `${left} question${left > 1 ? "s are" : " is"} not answered yet. Press "Finish and mark" again to finish anyway.`; return; }
    finishExam();
  });
  timerId = setInterval(() => { const t = $("#tm"); if (t) t.textContent = fmtTime(Date.now() - EX.start); }, 1000);
}
function finishExam(){
  clearInterval(timerId);
  EX.done = true; EX.time = Date.now() - EX.start;
  EX.ok = EX.qs.map((q, i) => sameSet(EX.ans[i], q.ans));
  EX.score = EX.ok.filter(Boolean).length;
  P.exams.push({at: Date.now(), score: EX.score, total: EX.qs.length}); P.exams = P.exams.slice(-20); save();
  renderExamResult(); window.scrollTo(0, 0);
}
function renderExamResult(){
  const N = EX.qs.length, pct = Math.round(100 * EX.score / N);
  const by = {};
  EX.qs.forEach((q, i) => { by[q.ch] = by[q.ch] || {ok: 0, n: 0}; by[q.ch].n++; if (EX.ok[i]) by[q.ch].ok++; });
  const rows = Object.keys(by).map(Number).sort((a, b) => by[a].ok / by[a].n - by[b].ok / by[b].n || a - b);
  const bars = rows.map(ch => { const r = by[ch], p = r.ok / r.n, col = p >= .8 ? "var(--ok)" : p >= .5 ? "var(--warn)" : "var(--accent)";
    return `<div class="barrow"><a class="t" href="#ch${ch}">Ch ${ch} · ${esc(CH[ch - 1].title)}</a><div class="b"><i style="width:${Math.max(4, 100 * p)}%;background:${col}"></i></div><span class="n">${r.ok}/${r.n}</span></div>`; }).join("");
  const wrong = EX.qs.map((q, i) => ({q, i})).filter(x => !EX.ok[x.i]);
  view.innerHTML = `
  <div class="sec-h"><h2>Your result</h2><span class="timer">Time ${fmtTime(EX.time)}</span></div>
  <div class="card result">
    <div class="big" style="color:${pct >= 80 ? "var(--ok)" : pct >= 60 ? "var(--warn)" : "var(--accent)"}">${pct}%</div>
    <div><strong>${EX.score} out of ${N} correct.</strong> <span class="note">${pct >= 80 ? "Well done. Keep practising the chapters lowest on the list." : "Study the chapters at the top of the list first, then try again."}</span></div>
  </div>
  <div class="sec-h" style="margin-top:26px"><h2 style="font-size:24px">By chapter</h2><span class="note">Weakest first. Tap a chapter to study it.</span></div>
  <div class="card"><div class="bars">${bars}</div></div>
  <div class="sec-h" style="margin-top:26px"><h2 style="font-size:24px">Review your mistakes</h2><span class="note">${wrong.length} to review</span></div>
  <div class="quiz" id="review">${wrong.length ? "" : '<p class="note" style="padding:12px 0">No mistakes. Excellent.</p>'}</div>
  <div class="row" style="margin-top:20px"><button class="btn primary" type="button" id="again">New practice exam</button><a class="btn" href="#home">Back to chapters</a></div>
  ${footer}`;
  const rv = $("#review");
  wrong.forEach(({q, i}) => {
    const d = document.createElement("div"); d.innerHTML = quizHtml([q]); const item = d.firstElementChild;
    $(".qtag", item).textContent = `Question ${i + 1} · Chapter ${q.ch} · ${tagFor(q)}`;
    $$(".opt", item).forEach(b => b.setAttribute("aria-pressed", EX.ans[i].includes(+b.dataset.k) ? "true" : "false"));
    markItem(item, q); rv.appendChild(item);
  });
  $("#again").addEventListener("click", () => { EX = null; renderExam(); });
}

/* ---------- flashcards ---------- */
let FC = null;
function buildDeck(sel, onlyLearning){
  const cards = [];
  CH.forEach(c => { if (sel !== "all" && +sel !== c.ch) return;
    c.topics.forEach((t, k) => { if (!t.f) return; const id = c.ch + "." + (k + 1);
      if (onlyLearning && P.known[id]) return; cards.push({id, ch: c.ch, ctitle: c.title, t}); }); });
  return shuffle(cards);
}
function renderCards(){
  if (!FC) FC = {sel: "all", only: false, deck: buildDeck("all", false), i: 0, flipped: false};
  const total = Object.keys(P.known).length;
  const card = FC.deck[FC.i];
  view.innerHTML = `
  <div class="sec-h"><h2>Flashcards</h2><span class="note">${total} topic${total === 1 ? "" : "s"} marked as known</span></div>
  <div class="fc">
    <div class="row" style="margin-bottom:14px">
      <label for="fcsel" class="note">Chapter</label>
      <select id="fcsel"><option value="all">All chapters</option>${CH.map(c => `<option value="${c.ch}" ${String(c.ch) === FC.sel ? "selected" : ""}>Chapter ${c.ch}: ${esc(c.title)}</option>`).join("")}</select>
      <button class="chip" type="button" id="fconly" aria-pressed="${FC.only}">Only cards I'm still learning</button>
    </div>
    ${card ? `
    <div class="flash">
      <div class="meta"><span>Chapter ${card.ch} · ${esc(card.ctitle)}</span><span>${FC.i + 1} / ${FC.deck.length}</span></div>
      <h3>${esc(card.t.t)}</h3>
      <div class="prompt">${FC.flipped ? card.t.s : "What are the key facts? Say them out loud, then show the answer."}</div>
      ${FC.flipped ? `<div class="back"><div class="box rem"><span class="lbl">Remember</span>${card.t.f}</div>${card.t.x ? `<div class="box trap"><span class="lbl">Exam trap</span>${card.t.x}</div>` : ""}</div>` : ""}
    </div>
    <div class="fcbar">
      ${FC.flipped ? `<div class="row"><button class="btn" type="button" id="learn">Still learning</button><button class="btn primary" type="button" id="know">I know this</button></div>`
                   : `<button class="btn primary" type="button" id="flip">Show the answer</button>`}
      <div class="row"><button class="btn small" type="button" id="fprev" ${FC.i ? "" : "disabled"}>Back</button><button class="btn small" type="button" id="fskip">Skip</button></div>
    </div>` : `<div class="card"><p style="margin:0">No cards left in this set. ${FC.only ? "You know every topic in it. " : ""}Pick another chapter or turn off "Only cards I'm still learning".</p></div>`}
  </div>
  ${footer}`;
  $("#fcsel").addEventListener("change", e => { FC.sel = e.target.value; FC.deck = buildDeck(FC.sel, FC.only); FC.i = 0; FC.flipped = false; renderCards(); });
  $("#fconly").addEventListener("click", () => { FC.only = !FC.only; FC.deck = buildDeck(FC.sel, FC.only); FC.i = 0; FC.flipped = false; renderCards(); });
  const go = d => { FC.i = Math.max(0, Math.min(FC.deck.length, FC.i + d)); FC.flipped = false; renderCards(); };
  const fl = $("#flip"); if (fl) fl.addEventListener("click", () => { FC.flipped = true; renderCards(); });
  const kn = $("#know"); if (kn) kn.addEventListener("click", () => { P.known[card.id] = 1; save(); go(1); });
  const le = $("#learn"); if (le) le.addEventListener("click", () => { delete P.known[card.id]; save(); go(1); });
  const pv = $("#fprev"); if (pv) pv.addEventListener("click", () => go(-1));
  const sk = $("#fskip"); if (sk) sk.addEventListener("click", () => go(1));
}

/* ---------- quick reference ---------- */
function renderRef(){
  view.innerHTML = `
  <div class="sec-h"><h2>Quick reference</h2><span class="note">The numbers and values the exam asks about again and again</span></div>
  <label for="q" class="note" style="display:block;margin-bottom:6px">Search, for example "OSPF", "UDP 162" or "preference"</label>
  <input id="q" class="search" type="search" placeholder="Search the quick reference" autocomplete="off">
  <div id="refout"></div>
  ${footer}`;
  const out = $("#refout"), inp = $("#q");
  function hl(s, term){ const e = esc(s); if (!term) return e; const re = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig"); return e.replace(re, "<mark>$1</mark>"); }
  function draw(){
    const term = inp.value.trim(), t = term.toLowerCase();
    const groups = D.ref.groups.map(g => ({name: g.name, rows: g.rows.filter(r => !t || g.name.toLowerCase().includes(t) || r.join(" ").toLowerCase().includes(t))})).filter(g => g.rows.length);
    const v = D.ref.v.filter(r => !t || r.join(" ").toLowerCase().includes(t) || "v200 v600 enspslides".includes(t));
    out.innerHTML = groups.map(g => `<div class="refgrp"><h3>${hl(g.name, term)}</h3><div class="rtable">${g.rows.map(r => `<div class="rrow"><div class="i">${hl(r[0], term)}</div><div class="v">${hl(r[1], term)}</div><div class="n">${hl(r[2], term)}</div></div>`).join("")}</div></div>`).join("")
      + (v.length ? `<div class="refgrp"><h3>Slides (V600) vs eNSP (V200) commands</h3><div class="rtable v4"><div class="rrow rhead"><div>Task</div><div>eNSP (V200)</div><div>Slides (V600)</div><div>Note</div></div>${v.map(r => `<div class="rrow"><div class="i">${hl(r[0], term)}</div><div class="v">${hl(r[1], term)}</div><div class="v">${hl(r[2], term)}</div><div class="n">${hl(r[3], term)}</div></div>`).join("")}</div></div>` : "")
      || `<p class="note" style="margin-top:18px">Nothing matches "${esc(term)}". Try a shorter word.</p>`;
  }
  inp.addEventListener("input", draw); draw();
}

/* ---------- router ---------- */
function route(){
  const h = (location.hash || "").replace(/^#/, "") || "home";
  layer.innerHTML = "";
  if (/^ch\d+$/.test(h)) renderChapter(+h.slice(2));
  else if (h === "exam") renderExam();
  else if (h === "cards") renderCards();
  else if (h === "ref") renderRef();
  else renderHome();
  const tab = /^ch/.test(h) ? "home" : h;
  $$("#tabs a").forEach(a => a.classList.toggle("on", a.dataset.v === tab));
  $$(".pdfbtn").forEach(b => { b.hidden = !downloads; b.addEventListener("click", () => getPdf(b)); });
  window.scrollTo(0, 0);
}
view.addEventListener("click", e => {
  const j = e.target.closest("[data-jump]");
  if (j) { const el = document.getElementById(j.dataset.jump); if (el) el.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start"}); }
});
window.addEventListener("hashchange", route);
route();
})();
</script>
